<!--
  Plantilla de correo de Pauta (Supabase Auth).

  Se usa para las plantillas "magic_link" y "confirmation": el primer login crea
  el usuario y ese correo sale con la de confirmación.

  Variables de Supabase usadas aquí:
    {{ .Token }}      código de un solo uso
    {{ .TokenHash }}  hash del token, para el enlace
    {{ .SiteURL }}    site_url configurado en supabase/config.toml

  No se edita en el dashboard: la fuente de verdad es supabase/config.toml,
  que apunta a este archivo y se sube con "npx supabase config push".
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="background:#E9E5DC; margin:0; padding:32px 16px;"
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="max-width:430px; background:#FAF7F2; border-radius:14px; border:1px solid #EAE4D9;"
      >
        <tr>
          <td style="padding:28px 24px 8px 24px; text-align:center;">
            <div
              style="font-family:Georgia,'Times New Roman',serif; font-size:28px; font-weight:500; color:#2E2A24;"
            >
              Pauta
            </div>
            <div
              style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; color:#8A8175; padding-top:6px;"
            >
              Tu código para entrar
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 24px 4px 24px;">
            <div
              style="background:#FFFFFF; border:1px solid #E2DBCF; border-radius:11px; padding:22px 16px; text-align:center;"
            >
              <div
                style="font-family:'SF Mono',Menlo,Consolas,monospace; font-size:38px; letter-spacing:0.14em; color:#2E2A24; font-weight:600;"
              >
                {{ .Token }}
              </div>
            </div>
          </td>
        </tr>

        <tr>
          <td
            style="padding:14px 24px 0 24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13.5px; line-height:1.6; color:#6B6359; text-align:center;"
          >
            Si abriste Pauta desde la pantalla de inicio del iPhone, escribe este
            código en la app.
          </td>
        </tr>

        <tr>
          <td style="padding:18px 24px 6px 24px; text-align:center;">
            <a
              href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email"
              style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; color:#4F7A5D; text-decoration:underline;"
            >
              O entra desde el navegador con este enlace
            </a>
          </td>
        </tr>

        <tr>
          <td
            style="padding:16px 24px 26px 24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:11.5px; line-height:1.6; color:#9A9184; text-align:center;"
          >
            Si no pediste este código, puedes ignorar este correo.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
